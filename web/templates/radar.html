<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行业雷达 - 行业先行投研系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📊 行业先行投研系统</h1>
            <ul class="nav-menu">
                <li><a href="/">首页</a></li>
                <li><a href="/radar" class="active">行业雷达</a></li>
                <li><a href="/commodities">商品品种</a></li>
                <li><a href="/companies">公司列表</a></li>
                <li><a href="/demo">演示</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <h2>行业雷达</h2>
            <p>主动发现行业机会，基于多维度信号识别投资价值</p>
        </section>

        <section id="radar-summary" style="background: white; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            <h3>雷达概览</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem;">
                <div style="padding: 1rem; background: #ecf0f1; border-radius: 4px;">
                    <div style="font-size: 1.5rem; font-weight: bold; color: #2c3e50;">-</div>
                    <div style="color: #7f8c8d;">总行业数</div>
                </div>
                <div style="padding: 1rem; background: #fadbd8; border-radius: 4px;">
                    <div style="font-size: 1.5rem; font-weight: bold; color: #e74c3c;" id="inflection-count">-</div>
                    <div style="color: #7f8c8d;">拐点候选</div>
                </div>
                <div style="padding: 1rem; background: #d5f4e6; border-radius: 4px;">
                    <div style="font-size: 1.5rem; font-weight: bold; color: #27ae60;" id="stable-count">-</div>
                    <div style="color: #7f8c8d;">稳定行业</div>
                </div>
                <div style="padding: 1rem; background: #ffeaa7; border-radius: 4px;">
                    <div style="font-size: 1.5rem; font-weight: bold; color: #f39c12;" id="watch-count">-</div>
                    <div style="color: #7f8c8d;">观察行业</div>
                </div>
            </div>
        </section>

        <section class="industry-list" id="industry-list">
            <p style="text-align: center; color: #7f8c8d;">正在加载行业数据...</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 行业先行投研系统 v1.0.0-dev</p>
    </footer>

    <script>
        async function loadRadarData() {
            try {
                const response = await fetch('/api/radar/latest');
                const data = await response.json();

                // 更新概览
                const summary = data.summary;
                document.getElementById('inflection-count').textContent = summary.by_state.INFLECTION_CANDIDATE || 0;
                document.getElementById('stable-count').textContent = summary.by_state.STABLE || 0;
                document.getElementById('watch-count').textContent = summary.by_state.WATCH || 0;

                // 渲染行业列表
                const listElement = document.getElementById('industry-list');
                listElement.innerHTML = '';

                // 按排名排序
                const industries = data.industries.sort((a, b) => a.rank - b.rank);

                industries.forEach(industry => {
                    const card = createIndustryCard(industry);
                    listElement.appendChild(card);
                });
            } catch (error) {
                console.error('加载雷达数据失败:', error);
                document.getElementById('industry-list').innerHTML = '<p style="text-align: center; color: #e74c3c;">加载数据失败</p>';
            }
        }

        function createIndustryCard(industry) {
            const card = document.createElement('div');
            card.className = `industry-card ${industry.state.toLowerCase().replace('_', '-')}`;

            const statusClass = industry.state === 'INFLECTION_CANDIDATE' ? 'status-inflection' :
                              industry.state === 'STABLE' ? 'status-stable' : 'status-watch';
            const statusText = industry.state === 'INFLECTION_CANDIDATE' ? '拐点候选' :
                             industry.state === 'STABLE' ? '稳定' : '观察';

            const signalsHTML = industry.signals.map(signal => {
                const directionClass = signal.direction === 'positive' ? 'positive' :
                                     signal.direction === 'negative' ? 'negative' : '';
                const directionIcon = signal.direction === 'positive' ? '📈' :
                                    signal.direction === 'negative' ? '📉' : '➡️';
                return `<div class="signal ${directionClass}">
                    ${directionIcon} <strong>${signal.name}</strong>: ${signal.value}
                </div>`;
            }).join('');

            const opportunitiesHTML = industry.opportunity_types.length > 0 ?
                `<p><strong>机会类型:</strong> ${industry.opportunity_types.join(', ')}</p>` : '';

            card.innerHTML = `
                <h3>#${industry.rank} ${industry.display_name} <span class="industry-status ${statusClass}">${statusText}</span></h3>
                <p><strong>类别:</strong> ${industry.category}</p>
                ${opportunitiesHTML}
                <div class="signals">${signalsHTML}</div>
                <p style="margin-top: 1rem; color: #7f8c8d;"><em>${industry.reason}</em></p>
            `;

            return card;
        }

        // 页面加载时执行
        loadRadarData();
    </script>
</body>
</html>
